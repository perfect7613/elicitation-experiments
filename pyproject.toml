[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "elicitation-experiments"
version = "0.1.0"
description = "Reproducible statement-vs-question elicitation experiments on frozen agent transcripts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
analysis = ["matplotlib>=3.9"]
dev = ["pytest>=8.3", "ruff>=0.9"]
modal = ["modal>=1.5.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/hughes_forensics"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

